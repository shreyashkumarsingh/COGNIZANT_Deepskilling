<div class="home-container">
  <section class="hero-section">
    <h1>Welcome to {{ portalName }}</h1>
    <p class="description">
      Your all-in-one portal for managing academic courses, viewing grades, and enrolling in new semesters.
    </p>

    <div class="action-bar">
      <button type="button" class="btn btn-enroll" [disabled]="!isPortalActive" (click)="onEnrollClick()">
        Enroll Now
      </button>
      <span *ngIf="message" class="enroll-message">{{ message }}</span>
    </div>
  </section>

  <section class="search-section">
    <div class="search-box">
      <label for="search-input">Search Portal:</label>
      <input
        id="search-input"
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Type course name or code..."
      />
    </div>
    <p *ngIf="searchTerm" class="search-feedback">
      Searching for: <strong>{{ searchTerm }}</strong>
    </p>
  </section>

  <section class="stats-section">
    <h3>Academic Dashboard Stats</h3>
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-number">{{ coursesCount }}</span>
        <span class="stat-label">Courses Available</span>
      </div>
      <div class="stat-card">
        <span class="stat-number">{{ enrolledCount }}</span>
        <span class="stat-label">Enrolled</span>
      </div>
      <div class="stat-card">
        <span class="stat-number">{{ gpa }}</span>
        <span class="stat-label">GPA</span>
      </div>
    </div>
  </section>
</div>
