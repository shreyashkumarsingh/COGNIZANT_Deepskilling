<div class="course-list-container">
  <div class="list-header">
    <h2>Available Courses</h2>

    <div class="search-filter">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange()"
        placeholder="Filter courses by search..."
      />
    </div>
  </div>

  <div *ngIf="isLoading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading courses...</p>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    <p>{{ errorMessage }}</p>
  </div>

  <div *ngIf="!isLoading && !errorMessage">
    <div *ngIf="courses.length > 0; else noCourses" class="course-grid">
      <div *ngFor="let course of courses; let i = index; trackBy: trackByCourseId" class="card-wrapper">
        <app-course-card
          [course]="course"
          [isEnrolled]="isEnrolled(course.id)"
          (enrollRequested)="onEnroll($event)"
          (click)="navigateToDetail(course.id)"
        ></app-course-card>
      </div>
    </div>

    <ng-template #noCourses>
      <div class="empty-state">
        <p>No courses available.</p>
      </div>
    </ng-template>

    <div *ngIf="selectedCourseId" class="selected-summary">
      <p>Selected course ID: <strong>{{ selectedCourseId }}</strong></p>
    </div>
  </div>
</div>
